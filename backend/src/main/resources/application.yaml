spring:
  application:
    name:

  datasource:
    url:
    username:
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true
    database: postgresql

  flyway:
    enabled: true
    schemas: public
    default-schema: public
    locations: classpath:/db/migration
    baseline-on-migrate: true
    baseline-version: 0

  security:
    jwt:
      secret:
      expiration:

  devtools:
    restart:
      enabled:

server:
  port:
  servlet:
    context-path:

management:
  endpoints:
    web:
      exposure:
        include: health,info
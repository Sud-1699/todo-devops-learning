services:
  postgres:
    container_name: postgres-sql-todo
    image: postgres
    environment:
      POSTGRES_USER: todo_dev
      POSTGRES_PASSWORD: todoDev@123
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: todo_db
    volumes:
      - postgres:/data/postgres
    ports:
      - 5433:5432
    networks:
      - spring-demo
    restart: unless-stopped

networks:
  spring-demo:
    driver: bridge

volumes:
  postgres:
    driver: local
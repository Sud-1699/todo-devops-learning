spring:
  application:
    name: ${APPLICATION_NAME}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true
    database: postgresql

  flyway:
    enabled: true
    schemas: public
    default-schema: public
    locations: classpath:/db/migration
    baseline-on-migrate: true
    baseline-version: 0

  devtools:
    restart:
      enabled:

security:
  jwt:
    secret: ${AUTH_SECRET}
    expiration: ${AUTH_EXPIRATION}

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${CONTEXT_PATH}

management:
  endpoints:
    web:
      exposure:
        include: health,info